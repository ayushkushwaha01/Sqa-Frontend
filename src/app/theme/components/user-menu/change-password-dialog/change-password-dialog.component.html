<div class="dialog-header bg-primary text-white p-3" fxLayout="row" fxLayoutAlign="space-between center">
  <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
    <mat-icon>password</mat-icon>
    <h2 class="m-0 fs-18 fw-600">Change Password</h2>
  </div>
  <button mat-icon-button (click)="close()" class="text-white">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="p-4">
  <div fxLayout="column" fxLayoutGap="16px">

    <!-- Current Password -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Current Password</mat-label>
      <input matInput [type]="hideOldPassword ? 'password' : 'text'" formControlName="oldPassword" placeholder="Enter current password">
      <button mat-icon-button matSuffix type="button" (click)="hideOldPassword = !hideOldPassword" [attr.aria-label]="'Hide password'">
        <mat-icon>{{ hideOldPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.controls.oldPassword.hasError('required')">Current password is required</mat-error>
    </mat-form-field>

    <!-- New Password -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>New Password</mat-label>
      <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword" placeholder="Enter new password">
      <button mat-icon-button matSuffix type="button" (click)="hideNewPassword = !hideNewPassword">
        <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.controls.newPassword.hasError('required')">New password is required</mat-error>
      <mat-error *ngIf="form.controls.newPassword.hasError('minlength')">Password must be at least 6 characters</mat-error>
    </mat-form-field>

    <!-- Confirm Password -->
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Confirm New Password</mat-label>
      <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Confirm new password">
      <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
        <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.controls.confirmPassword.hasError('required')">Confirm password is required</mat-error>
    </mat-form-field>

  </div>

  <div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="12px" class="mt-4">
    <button mat-button type="button" (click)="close()" [disabled]="isSubmitting">Cancel</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting">
      <span *ngIf="!isSubmitting">Update Password</span>
      <span *ngIf="isSubmitting">Updating...</span>
    </button>
  </div>
</form>

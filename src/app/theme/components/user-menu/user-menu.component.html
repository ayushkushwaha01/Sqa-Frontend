<!-- after introducing supplier login -->
<button mat-icon-button [matMenuTriggerFor]="userMenu" #userMenuTrigger="matMenuTrigger">
    <mat-icon style="color:white;">account_circle</mat-icon>
</button>

<mat-menu #userMenu="matMenu" [overlapTrigger]="false" class="toolbar-dropdown-menu user-menu">
    <div class="user-menu-header">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="16px" class="user-info">
            <img [src]="userImage" alt="user-profile" class="user-image mat-elevation-z2">
            <div class="user-details" fxLayout="column" fxLayoutAlign="center start">
                <span class="user-name">{{ userName }}</span>
                <span class="user-type">{{ userType }}</span>
            </div>
        </div>  
    </div>
    
    <mat-divider></mat-divider>

    <a mat-menu-item routerLink="/"> 
        <mat-icon>lock</mat-icon>
        <span>Lock screen</span> 
    </a>
    <a mat-menu-item disabled> 
        <mat-icon>password</mat-icon>
        <span>Change Password</span> 
    </a>
    
    <mat-divider></mat-divider>
    
    <!-- Uses the click event to wipe memory -->
    <a mat-menu-item (click)="logout()" style="cursor: pointer;"> 
        <mat-icon color="warn">power_settings_new</mat-icon>
        <span class="text-warn">Log out</span> 
    </a>
</mat-menu>

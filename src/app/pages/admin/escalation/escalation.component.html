<div fxLayout="row wrap" #resizedDiv>

  <div class="col-sm-12 flex-p w-100">

    <div class="table-responsive sizeAlign">

      <table id="example2" style="margin-top: 10px; width: 99%; margin-left: 14px;"
        class="table table-bordered table-hover">

        <thead class="tbl-head">
          <tr class="tr-grid-header">
            <th>Escalation</th>
            <th>Description</th>
            <th>Current Value</th>
            <th>Revised Value</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let item of values">

            <!-- Escalation -->
            <td>
              {{ item.escalationName }}
            </td>

            <!-- Description -->
            <td>
              {{ item.description }}
            </td>

            <!-- Current Value -->
            <td>
              {{ item.previousValue }}
            </td>

            <!-- Revised Value -->
            <td>

              <input type="text" class="form-control" [(ngModel)]="item.newValue" placeholder="Enter Revised Value">

            </td>

            <!-- Actions -->
            <td>

              <div style="display: flex; justify-content: center;">

                <button mat-raised-button color="primary" matTooltip="Click to Save" (click)="saveEscalation(item)">

                  <mat-icon style="font-size: 20px;" class="mt-1">
                    save
                  </mat-icon>

                  <span style="margin-left: 5px;">
                    Save
                  </span>

                </button>

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>

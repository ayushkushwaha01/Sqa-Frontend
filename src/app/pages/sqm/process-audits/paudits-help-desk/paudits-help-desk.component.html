<div class="NewHeader">
    <h1 style=" padding-left: 20px; font-size: 20px;">Send Mail ({{ data?.module }})</h1>
</div>

<div style="padding: 10px 20px 20px 20px;">
    <form>
        <div>
            <div class="row" style="margin-bottom: 16px; align-items: center;">
                <div class="col-sm-3">
                    <label class="add-member-label" style="font-weight: bold; font-size: 14px;">Subject :</label>
                </div>
                <div class="col-sm-9">
                    <input type="text" class="form-control" placeholder="Enter Subject" [(ngModel)]="subject"
                        name="subject">
                </div>
            </div>

            <div class="row" style="margin-bottom: 16px;">
                <div class="col-sm-3">
                    <label class="add-member-label"
                        style="font-weight: bold; font-size: 14px; margin-top: 6px;">Description :</label>
                </div>
                <div class="col-sm-9">
                    <textarea class="form-control" rows="6" style="min-height: 140px; resize: vertical;"
                        placeholder="Enter Description" [(ngModel)]="description" name="description"></textarea>
                </div>
            </div>
        </div>
    </form>

    <mat-dialog-actions align="end"
        style="margin-top: 20px; padding: 0; display: flex; justify-content: flex-end; gap: 10px;">
        <button mat-raised-button class="btn-default" (click)="close()" style="background-color: lightgray; color: red;"
            [disabled]="isSending">
            <mat-icon>cancel</mat-icon> Close
        </button>

        <button mat-raised-button type="button" class="save" color="primary" (click)="save()" [disabled]="isSending">
            <mat-icon>{{ isSending ? 'hourglass_empty' : 'send' }}</mat-icon>
            {{ isSending ? 'Sending...' : 'Send' }}
        </button>
    </mat-dialog-actions>
</div>

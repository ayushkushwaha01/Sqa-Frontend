<!-- Filter Bar wired to Reactive Form -->
<div class="filter-bar" [formGroup]="filterForm">
    <div class="filter-group right-align-group">
        <label class="filter-label mb-0">Commodity :</label>
        <mat-select placeholder="All Commodities" class="form-control" formControlName="commodityId"
            style="width: auto; min-width: 150px;">
            <mat-option [value]="null">All Commodities</mat-option>
            <mat-option *ngFor="let c of commodities" [value]="c.commodityId">
                {{ c.name }}
            </mat-option>
        </mat-select>
    </div>

    <div class="filter-group right-align-group">
        <label class="filter-label mb-0">Select Year :</label>
        <mat-select placeholder="Select Year" class="form-control" formControlName="year"
            style="width: auto; min-width: 120px;">
            <mat-option value="2023">2023</mat-option>
            <mat-option value="2024">2024</mat-option>
            <mat-option value="2025">2025</mat-option>
            <mat-option value="2026">2026</mat-option>
        </mat-select>
    </div>

    <button class="go-btn" mat-raised-button (click)="loadBellCurveData()">
        <mat-icon class="mat-icon mt-1">search</mat-icon> Go
    </button>
</div>

<!-- CanvasJS Chart Container -->
<div class="dashboard-container">
    <div class="chart-wrapper">
        <canvasjs-chart [options]="chartOptions" [styles]="{'width': '100%', 'height': '450px', 'display': 'block'}">
        </canvasjs-chart>
    </div>
</div>

<div class="custom-layout-wrapper">

    <div class="table-responsive bg-white shadow-sm">
        <table class="custom-grid-table">
            <thead>
                <tr>
                    <th style="width:30%">Subject</th>
                    <th class="text-center" style="width:220px;">Min</th>
                    <th class="text-center" style="width:220px;">Max</th>
                    <th class="text-center" style="width:180px;">Actions</th>
                </tr>
            </thead>

            <tbody>

                <tr *ngFor="let item of tableData">

                    <td>
                        {{item.subject}}
                    </td>

                    <td class="text-center">

                        <input class="form-control text-center" type="number" [(ngModel)]="item.min"
                            [readonly]="item.subject == 'Parts Audit Poor Band'">

                    </td>

                    <td class="text-center">

                        <input class="form-control text-center" type="number" [(ngModel)]="item.max" readonly>

                    </td>

                    <td class="text-center">

                        <button mat-raised-button color="primary" (click)="saveBand(item)">

                            <mat-icon class="mt-1">save</mat-icon>

                            Save

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>
    </div>
</div>
